<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>L2 Virtual Boost - High Five</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================
           LAUNCHER
        ===================================== */

        .launcher {

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(0, 55, 110, 0.15) 0%,
                    rgba(0, 0, 0, 0.95) 70%,
                    #000000 100%
                );
        }


        /* =====================================
           LOGO
        ===================================== */

        .logo {

            text-align: center;

            margin-top: 3vh;

            margin-bottom: 12px;

            flex-shrink: 0;

            position: relative;

            z-index: 2;
        }


        .logo-top {

            font-family: Georgia, "Times New Roman", serif;

            font-size: 13px;

            letter-spacing: 8px;

            color: #8bb8e8;

            text-transform: uppercase;

            text-shadow:
                0 0 5px rgba(0, 140, 255, 0.9),
                0 0 12px rgba(0, 100, 255, 0.5);
        }


        .logo-main {

            font-family: Georgia, "Times New Roman", serif;

            font-size: 56px;

            font-weight: bold;

            letter-spacing: 4px;

            line-height: 1;

            color: #dcecff;

            text-transform: uppercase;

            text-shadow:
                0 2px 0 #173b60,
                0 0 5px rgba(0, 140, 255, 0.9),
                0 0 15px rgba(0, 110, 255, 0.65),
                0 0 30px rgba(0, 80, 255, 0.35);
        }


        .logo-bottom {

            margin-top: 7px;

            font-size: 10px;

            letter-spacing: 5px;

            color: #7596b8;

            text-transform: uppercase;
        }


        /* =====================================
           LINHA SUPERIOR
        ===================================== */

        .neon-line {

            width: 144%;

            height: 2px;

            flex-shrink: 0;

            margin: 6px 0;

            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(0, 100, 255, 0.25) 5%,
                #007fff 25%,
                #00bfff 50%,
                #007fff 75%,
                rgba(0, 100, 255, 0.25) 95%,
                transparent 100%
            );

            box-shadow:
                0 0 4px #008cff,
                0 0 10px rgba(0, 145, 255, 0.8),
                0 0 20px rgba(0, 100, 255, 0.4);
        }


        /* =====================================
           VÍDEO
        ===================================== */

        .video-container {

            width: 257.4%;

            max-width: 1787.5px;

            background: #000000;

            overflow: hidden;

            border: 1px solid rgba(0, 145, 255, 0.45);

            box-shadow:
                0 0 5px rgba(0, 145, 255, 0.6),
                0 0 15px rgba(0, 110, 255, 0.35),
                inset 0 0 20px rgba(0, 60, 120, 0.15);
        }


        .video-container video {

            display: block;

            width: 100%;

            height: auto;

            max-height: 74.36vh;

            object-fit: contain;

            border: 0;

            outline: 0;

            background: #000000;
        }


        /* =====================================
           LINHA INFERIOR (Igualada à superior)
        ===================================== */
		
		.badge {
		  display: inline-block;
		  padding: 1px 9px;
		  background: rgba(15, 23, 42, 0.6);
		  border: 1px solid rgba(212, 175, 55, 0.3); /* Tom dourado sutil */
		  border-radius: 4px;
		  color: #e2e8f0;
		  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		  font-size: 0.85rem;
		  font-weight: 600;
		  letter-spacing: 2px;
		  text-transform: uppercase;
		  backdrop-filter: blur(4px);
		  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
		}

        .linha-final {

            width: 100%;

            height: 2px;

            flex-shrink: 0;

            margin-top: 6px;

            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(0, 100, 255, 0.25) 5%,
                #007fff 25%,
                #00bfff 50%,
                #007fff 75%,
                rgba(0, 100, 255, 0.25) 95%,
                transparent 100%
            );

            box-shadow:
                0 0 4px #008cff,
                0 0 10px rgba(0, 145, 255, 0.8),
                0 0 20px rgba(0, 100, 255, 0.4);
        }


        /* =====================================
           TELAS MENORES
        ===================================== */

        @media screen and (max-width: 900px) {

            .logo-main {
                font-size: 44px;
            }

            .video-container {
                width: 185.9%;
            }

            .video-container video {
                max-height: 286vh;
            }
        }


        @media screen and (max-height: 700px) {

            .logo {

                margin-top: 1vh;

                margin-bottom: 6px;
            }

            .logo-top {
                font-size: 10px;
            }

            .logo-main {
                font-size: 40px;
            }

            .logo-bottom {
                margin-top: 4px;
            }

            .neon-line,
            .linha-final {
                margin-top: 3px;
                margin-bottom: 3px;
            }

            .video-container video {
                max-height: 71.5vh;
            }
        }


        @media screen and (max-height: 550px) {

            .logo {
                margin-top: 0;
                margin-bottom: 4px;
            }

            .logo-top {
                font-size: 8px;
            }

            .logo-main {
                font-size: 32px;
            }

            .logo-bottom {
                font-size: 7px;
                margin-top: 3px;
            }

            .video-container video {
                max-height: 65.78vh;
            }
        }

    </style>

</head>


<body>


    <div class="launcher">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-top">
                L2
            </div>

            <div class="logo-main">
                Virtual Boost
			</div>
  <div class="badge reveal">

    LINEAGE II · CHRONICLE HIGH FIVE · LOW RATE

  </div>

        </div>


        <!-- LINHA SUPERIOR -->

        <div class="neon-line"></div>


        <!-- VÍDEO -->

		<div class="video-container">
    <!-- Removeu-se o 'muted' para o som funcionar. Adicionou-se 'controls' para o usuário ligar o som se o navegador bloquear -->
    <video autoplay loop playsinline preload="auto" controls>
        <source src="https://virtualboost.online/update/Web/vb4.mp4" type="video/mp4">
    </video>
</div>




        <!-- LINHA INFERIOR -->

        <div class="linha-final"></div>


    </div>


</body>

</html>
